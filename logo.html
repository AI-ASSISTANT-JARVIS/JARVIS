<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Arc Reactor Logo</title>
  <style>
    * {
      box-sizing: border-box;
    }body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #101d35, #02040a 70%);
  color: #eafaff;
  font-family: Arial, sans-serif;
}

.reactor {
  width: 220px;
  height: 220px;
  position: relative;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 0 16px #008cff);
}

.triangle {
  width: 190px;
  height: 190px;
  background: linear-gradient(145deg, #ff3131, #1a91ff 65%, #061b40);
  clip-path: polygon(50% 100%, 0 5%, 100% 5%);
  display: grid;
  place-items: center;
}

.inner {
  width: 158px;
  height: 158px;
  background: #07101f;
  clip-path: polygon(50% 100%, 0 5%, 100% 5%);
  display: grid;
  place-items: center;
}

.core {
  width: 70px;
  height: 70px;
  margin-top: -15px;
  border-radius: 50%;
  background: radial-gradient(circle, white 0%, #8cecff 25%, #008cff 60%, #05265b 100%);
  box-shadow: 0 0 18px #00bfff, 0 0 40px #006eff;
}

h1 {
  margin-top: 32px;
  letter-spacing: 8px;
  text-shadow: 0 0 12px #008cff;
}

p {
  color: #9eb9d9;
  letter-spacing: 2px;
}

  </style>
</head>
<body>
  <div class="reactor" role="img" aria-label="Triangular glowing JARVIS arc reactor">
    <div class="triangle">
      <div class="inner">
        <div class="core"></div>
      </div>
    </div>
  </div>  <h1>JARVIS</h1>
  <p>ARC REACTOR SYSTEM</p>
</body>
</html>
